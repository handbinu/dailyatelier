spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:dailyatelier-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key}
jwt.expiration=86400000
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:test-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test-secret}
