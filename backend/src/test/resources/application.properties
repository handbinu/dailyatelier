spring.flyway.enabled=false
spring.config.import=optional:file:daliyatelier.env[.properties]
spring.datasource.url=${DB_URL:jdbc:h2:mem:dailyatelier-test}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key}
jwt.expiration=86400000
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:test-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test-secret}
